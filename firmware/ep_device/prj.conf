CONFIG_GPIO=y
# the RHS2116 module (firmware/modules/rhs2116) drives SPIM2, TIMER2/3, GPIOTE and
# PPI directly and selects what it needs; NRFX_SPIM2 is only needed for SPIM pinctrl
# support, and is set here because the board's devicetree picks the SPIM
CONFIG_NRFX_SPIM2=y
CONFIG_LOG=y

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_ZEPHYR_NUS=y
CONFIG_BT_DEVICE_NAME="mouse"

# Maximum ATT/L2CAP MTU (247 = 251-byte LL data length PDU minus 4-byte
# L2CAP header), backed by matching ACL buffer and controller data length
# sizes so the larger MTU can actually be carried end-to-end.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# Streaming throughput. In Zephyr's controller BT_BUF_ACL_TX_COUNT is also the
# link layer TX queue depth; the default 3 ends each connection event after 3
# packets, leaving the rest of the interval idle. The other counts keep the
# host from becoming the bottleneck instead. recording.c sends with one credit
# per ATT TX buffer (see ble_handler_send_data()).
CONFIG_BT_BUF_ACL_TX_COUNT=16
CONFIG_BT_L2CAP_TX_BUF_COUNT=16
CONFIG_BT_ATT_TX_COUNT=16
CONFIG_BT_CONN_TX_MAX=16

# Connection parameters requested ~5 s after connecting: the default 30-50 ms
# interval (the link test reaches ~1.3 Mbit/s with it), but a 4 s supervision
# timeout like the base node's instead of the default 420 ms, which is easily
# missed under load.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=24
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=40
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# report negotiated PHY and data length (logged in ble_handler.c). The USER_*
# options turn the AUTO_* ones off by default, and without AUTO_DATA_LEN_UPDATE
# the host never raises the controller's default TX length from 27 bytes, so
# both are re-enabled explicitly.
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_AUTO_PHY_UPDATE=y
CONFIG_BT_AUTO_DATA_LEN_UPDATE=y
