CONFIG_LOG=y
# Deferred logging keeps the BT RX thread from blocking on the UART; bump the
# buffer so bursts of incoming packets aren't dropped as readily.
CONFIG_LOG_BUFFER_SIZE=8192

# Shell over the console UART (USB CDC ACM on the nice!nano) for PC control,
# e.g. "start link_test" / "stop link_test".
CONFIG_SHELL=y

# The data stream goes out a second CDC ACM port (see usb_stream.h); line
# control lets it check DTR so nothing is queued while no host has it open.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_RING_BUFFER=y

CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_DEVICE_NAME="base"

# Match ep_device's 247-byte ATT MTU so its NUS packets (larger than the
# default 20-byte notification payload) fit in a single notification.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# Receive throughput. With the default single controller RX buffer the link layer
# NACKs every packet after the first until the host has taken it, so connection
# events carry few packets. 18 is the controller's maximum; the host gets enough
# ACL buffers to keep up.
CONFIG_BT_CTLR_RX_BUFFERS=18
CONFIG_BT_BUF_ACL_RX_COUNT=20
